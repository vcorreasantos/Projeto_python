<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'tahoma';
            font-size: 30pt;
            text-align: center;
        }

        table {
            width: 90vw;
            margin-left: auto;
            margin-right: auto;
        }

        th {
            background-color: rgba(214, 27, 174, 0.507);
            color: rgb(255, 255, 255);
            font-family: 'tohama';
            padding: 10px;
        }

        td {
            font-family: 'tahoma';
            font-size: 11pt;
            padding: 10px;
        }

        tr {
            transition: ease 1s;
        }

        tr:hover {
            background-color: rgb(209, 157, 187);
        }

        td img {
            width: 20px;
            height: 20px;
            margin-left: 60px;
        }

        td:nth-child(5) {
            display: flex;
            justify-content: space-around;
            align-content: center;

        }

        h3:nth-child(2) {
            font-family: 'Lucita Sans';
            font-size: 20pt;
            margin-top: 80px;
            text-align: center;
            border-bottom: 1px solid rgb(209, 157, 187);
        }

        form {
            width: 70vw;
            margin-left: auto;
            margin-right: auto;
            padding: 30px;
            background-color: #f3cbe4c5;
            margin-top: 10px;
        }

        input,
        select {
            padding: 10px;
            font-size: 12pt;
            width: 24.6%;
        }

        input[type=submit] {
            background-color: rgba(196, 6, 63, 0.507);
            color: rgb(160, 2, 94);
            border: 0;
            transition: ease 0.5s;

        }

        input[type=submit]:hover {
            background-color: rgb(255, 152, 200);
            color: rgb(160, 2, 94);
            cursor: pointer;
            border-radius: 10px;
            transform: scale(1.2);
        }
        h3:nth-child(4){
            text-align: center;
            margin-top: 50px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgb(255, 152, 200);
            font-family: 'tahoma';
            font-size: 20pt;

        }
    </style>
</head>

<body>
    <h1>Gerenciar Produtos</h1>

    <h3>Cadastrar Produtos</h3>
    <form action="/adicionar" method="post">
        <input type="text" name="nome" placeholder="Nome do Produto">
        <select name="tipo" id="">
            <option value="Selecione">Selecione um tipo</option>
            <option value="Alimento">Alimento</option>
            <option value="Bebida">Bebida</option>
            <option value="Limpeza">Limpeza</option>
            <option value="Beleza">Beleza</option>
        </select>
        <input type="number" name="preco" placeholder="Preço" step="0.01" min="0.0" max="500.00" volue="0.0">
        <input type="submit" value="Gravar">
    </form>





    <h3>Produtos Cadastrados</h3>
    <table>
        <tr>
            <th>Id</th>
            <th>Nome Produto</th>
            <th>Tipo</th>
            <th>Preço</th>
            <th>Editar | Apagar</th>
        </tr>
        <!-- Criar uma estrutura for -->
        <!-- avisando que vamos usar o python por isso essa estruturas -->
        {% for p in produtos %}
        <tr>
            <td>{{p.id}}</td>
            <td>{{p.nome}}</td>
            <td>{{p.tipo}}</td>
            <td>{{p.preco}}</td>
            <td>
                <a href="/editar/{{p.id}}">
                    <img src={{url_for('static',filename='edit.png')}}>
                    editar
                </a>
                |
                <a href="/apagar/{{p.id}}">
                    <img src={{url_for('static',filename='delete.png')}}>
                    apagar
                </a>
            </td>
        </tr>
        <!-- termino de python -->
        {% endfor %}
    </table>
</body>

</html>
