<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apagar</title>
</head>
<style>
    h1{
        font-family: arial;
        font-size:15pt;
        text-align: center;
        border-bottom: 2px dotted silver;
        margin-bottom: 100px;
    }
    div button{
        text-decoration: none;
        padding:20px;
        background-color: rgb(195, 27, 218);
        color: #fff;
        font-weight: bold;
        transition: ease 0.5s;
        border: 0;
        cursor: pointer;
    }
    div button:hover{
        transform: scale(1.2);
        transform: rotate(360deg);
        border-radius: 30px;
    }
    div{
        text-align: center;
    }
</style>
<body>
    <h1>Você apagou o produto</h1>
    <div>
        <button onclick="history.back()">Voltar</button>
    </div>
</body>
</html>
